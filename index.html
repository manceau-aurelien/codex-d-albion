réel.",falseFriendTrap:"Faux-ami célèbre : ne veut JAMAIS dire « actuellement » ! Il signifie « en réalité / en fait »."},{id:"b_one",tierId:"tier_1",subtierId:"1C",en:"one",variants:[],fr:"un (chiffre 1)",frAlternatives:["un","1","seul"],ipa:"/wʌn/",pos:"determiner",audioUkUrl:"./audio/tier1/uk_b_one.mp3",audioUsUrl:"./audio/tier1/us_b_one.mp3",mnemonicNote:"Se prononce /wʌn/ (commence par un son « ou », comme « ouane »)."},{id:"b_three",tierId:"tier_1",subtierId:"1C",en:"three",variants:["tree"],fr:"trois (chiffre 3)",frAlternatives:["trois","3"],ipa:"/θriː/",pos:"determiner",audioUkUrl:"./audio/tier1/uk_b_three.mp3",audioUsUrl:"./audio/tier1/us_b_three.mp3",mnemonicNote:"Langue entre les dents sur le « th ».",falseFriendTrap:"Sans le « h », « tree » (/triː/) veut dire un ARBRE !"}],Qo=[{id:"f_1a",tierId:"tier_1",subtierId:"1A",name:"Formule I : L'Antéposition Immuable",subtitle:"Ordre de l'adjectif, invariabilité au pluriel et mutation phonétique a / an",patternSlots:[{id:"slot_det",label:"Déterminant (the / a / an)",pos:"determiner"},{id:"slot_adj",label:"Adjectif (old / big / cold)",pos:"adjective"},{id:"slot_noun",label:"Nom (door / stone / keys)",pos:"noun"}],inductiveSteles:[{enBricks:["A","cold","stone"],frTranslation:"Une pierre froide",highlightNote:"Observe la position de « cold » (froide) : l’adjectif se place toujours AVANT le nom « stone »."},{enBricks:["An","old","key"],frTranslation:"Une vieille clé",highlightNote:"Devant le son de voyelle de « old », l’article « a » devient « an » pour éviter le choc de voyelles."},{enBricks:["The","old","doors"],frTranslation:"Les vieilles portes",highlightNote:"« doors » prend un -s au pluriel, mais l’adjectif « old » reste invariable (jamais « olds ») !"}],trapQuestion:{question:"En observant la 3e stèle (« The old doors »), que se passe-t-il sur l'adjectif « old » au pluriel ?",options:[{id:"opt_1",text:"Il ne prend jamais de -S : l'adjectif anglais est totalement invariable.",isCorrect:!0},{id:"opt_2",text:"Il prend un -S comme en français (olds doors).",isCorrect:!1},{id:"opt_3",text:"Il se déplace après le nom quand il est au pluriel.",isCorrect:!1}]},coreRuleSummary:"1) L'adjectif anglais se place toujours AVANT le nom (a cold stone). 2) Il est totalement invariable et ne prend jamais de -s au pluriel (old doors). 3) Devant un son de voyelle, 'a' devient 'an' (an old key).",frenchTrapWarning:"Ne calque jamais l'ordre français (« a stone cold ») et n'ajoute jamais de -s à un adjectif (« the smalls doors »)."},{id:"f_1b",tierId:"tier_1",subtierId:"1B",name:"Formule II : Le Pilier d'État & La Neutralité des Choses",subtitle:"Verbe être (am/is/are), bouclier négatif 'not', pronom neutre 'it' et états physiques",patternSlots:[{id:"slot_subj",label:"Sujet (I / He / It / The key)",pos:"pronoun"},{id:"slot_be",label:"Verbe Être (am / is / are)",pos:"verb"},{id:"slot_not",label:"Négation (not - optionnel)",pos:"particle",optional:!0},{id:"slot_attr",label:"Adjectif ou Lieu (cold / small / here)",pos:"adjective"}],inductiveSteles:[{enBricks:["The","key","is","not","here"],frTranslation:"La clé n'est pas ici.",highlightNote:"En français la négation entoure le verbe (ne... pas). En anglais, un seul mot « not » se place juste APRÈS le verbe être."},{enBricks:["It","is","a","big","door"],frTranslation:"C'est (Elle est) une grande porte.",highlightNote:"Les objets n’ont pas de genre sexué : la porte (féminin en FR) est remplacée par « it », jamais par « she »."},{enBricks:["I","am","cold"],frTranslation:"J'ai froid (litt. : Je suis froid).",highlightNote:"Les états du corps utilisent le verbe ÊTRE (am/is/are) et non le verbe avoir : « I am cold »."}],trapQuestion:{question:"Quel pronom remplace « la vieille clé » (féminin en français) et quel verbe exprime « avoir froid » ?",options:[{id:"opt_1",text:"Le pronom 'she' et le verbe avoir.",isCorrect:!1},{id:"opt_2",text:"Le pronom neutre 'it' (objet inanimé), et le verbe être ('I am cold').",isCorrect:!0},{id:"opt_3",text:"Le pronom 'he' et la négation 'not' placée avant le verbe.",isCorrect:!1}]},coreRuleSummary:"1) Un seul mot 'not' placé juste après am/is/are suffit pour nier. 2) Tout objet singulier est neutre ('it'), jamais 'he' ou 'she'. 3) Les états physiques et émotionnels (avoir froid, avoir peur) utilisent le verbe ÊTRE (I am cold).",frenchTrapWarning:"Ne traduis jamais « La clé, elle est ici » par « she is here » (c'est un objet → « it is here ») ni « J'ai froid » par « I have cold »."},{id:"f_1c",tierId:"tier_1",subtierId:"1C",name:"Formule III : Le Sceau du Singulier (-S)",subtitle:"Actions au présent, mutation have → has et Paradoxe du S",patternSlots:[{id:"slot_subj3",label:"Sujet Singulier 3e pers. (He / She / It / The guard)",pos:"noun"},{id:"slot_verb_s",label:"Verbe d’action + S (sees / keeps / waits / has)",pos:"verb"},{id:"slot_obj",label:"Objet (the key / a shadow)",pos:"noun"}],inductiveSteles:[{enBricks:["I","see","the","guard.","He","sees","the","guard."],frTranslation:"Je vois le garde. Il voit le garde.",highlightNote:"Dès que le sujet est un seul individu ou objet tiers (He / She / It / The guard), le verbe reçoit le sceau « -s » (sees)."},{enBricks:["They","have","the","key.","She","has","the","key."],frTranslation:"Ils ont la clé. Elle a la clé.",highlightNote:"Exception majeure : avec He/She/It, « have » + « -s » se contracte en « has » (jamais « haves ») !"},{enBricks:["One","guard","waits.","Three","guards","wait."],frTranslation:"Un garde attend. Trois gardes attendent.",highlightNote:"Le Paradoxe du S : le -s sur un nom marque le pluriel (guards), mais le -s sur un verbe marque le SINGULIER (waits) !"}],trapQuestion:{question:"En quoi consiste le « Paradoxe du S » entre les noms et les verbes en anglais ?",options:[{id:"opt_1",text:"Le -s sur un nom marque le pluriel (three guards), mais le -s sur un verbe marque le SINGULIER (one guard waits, three guards wait).",isCorrect:!0},{id:"opt_2",text:"Le verbe prend un -s uniquement au pluriel avec 'they'.",isCorrect:!1},{id:"opt_3",text:"Le verbe 'have' devient 'haves' au singulier.",isCorrect:!1}]},coreRuleSummary:"1) Au présent, avec he, she, it ou un nom singulier, le verbe d'action reçoit un -s (sees, opens, keeps, waits). 2) 'have' devient 'has'. 3) Au pluriel (they, three guards), le verbe ne prend JAMAIS de -s.",frenchTrapWarning:"Ne mets jamais de -s au verbe après un sujet pluriel : « The three guards sees » est un piège → « The three guards see » !"}],gd=[{id:"ex_1a_1",tierId:"tier_1",subtierId:"1A",type:"assemble_fr_en",promptText:"Une vieille clé",spokenTarget:"An old key",targetSequence:["An","old","key"],distractorPool:["A","keys","olds","the"],requiredBrickIds:["b_a","b_old","b_key"],requiredFormulaIds:["f_1a"],defaultErrorFeedback:"Formule I : l’adjectif (« old ») se place avant le nom (« key »), et « A » devient « An » devant le son de voyelle de « old ».",specificFeedbacks:[{triggerBrickOrChoice:"A",errorCategory:"phonetic",explanation:"Presque ! « Old » commence par un son de voyelle (/oʊ/). Pour que la phrase coule à l’oreille, « a » se transforme obligatoirement en « an » devant un son de voyelle : « An old key ».",ruleReminder:"Devant un son de voyelle (old) : a → an."},{triggerBrickOrChoice:"olds",errorCategory:"morphology",explanation:"La brique « olds » est un piège ! En anglais, les adjectifs sont invariables et ne prennent jamais de -s.",ruleReminder:"Adjectif toujours invariable : old."},{triggerBrickOrChoice:"WORD_ORDER",errorCategory:"word_order",explanation:"C’est le réflexe français ! En anglais (Formule I), l’adjectif (« old ») se place toujours AVANT le nom qu’il décrit (« key »).",ruleReminder:"[Déterminant] + [Adjectif] + [Nom] → An old key."}]},{id:"ex_1a_2",tierId:"tier_1",subtierId:"1A",type:"corrupted_brick",promptText:"Les petites portes",spokenTarget:"The small doors",corruptedInitialSequence:["The","smalls","doors"],targetSequence:["The","small","doors"],distractorPool:["small","door","a"],requiredBrickIds:["b_the","b_small","b_door"],
