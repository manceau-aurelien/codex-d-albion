 prend un -S comme en français (olds doors).",isCorrect:!1},{id:"opt_3",text:"Il se déplace après le nom quand il est au pluriel.",isCorrect:!1}]},coreRuleSummary:"1) L'adjectif anglais se place toujours AVANT le nom (a cold stone). 2) Il est totalement invariable et ne prend jamais de -s au pluriel (old doors). 3) Devant un son de voyelle, 'a' devient 'an' (an old key).",frenchTrapWarning:"Ne calque jamais l'ordre français (« a stone cold ») et n'ajoute jamais de -s à un adjectif (« the smalls doors »)."},{id:"f_1b",tierId:"tier_1",subtierId:"1B",name:"Formule II : Le Pilier d'État & La Neutralité des Choses",subtitle:"Verbe être (am/is/are), bouclier négatif 'not', pronom neutre 'it' et états physiques",patternSlots:[{id:"slot_subj",label:"Sujet (I / He / It / The key)",pos:"pronoun"},{id:"slot_be",label:"Verbe Être (am / is / are)",pos:"verb"},{id:"slot_not",label:"Négation (not - optionnel)",pos:"particle",optional:!0},{id:"slot_attr",label:"Adjectif ou Lieu (cold / small / here)",pos:"adjective"}],inductiveSteles:[{enBricks:["The","key","is","not","here"],frTranslation:"La clé n'est pas ici.",highlightNote:"En français la négation entoure le verbe (ne... pas). En anglais, un seul mot « not » se place juste APRÈS le verbe être."},{enBricks:["It","is","a","big","door"],frTranslation:"C'est (Elle est) une grande porte.",highlightNote:"Les objets n’ont pas de genre sexué : la porte (féminin en FR) est remplacée par « it », jamais par « she »."},{enBricks:["I","am","cold"],frTranslation:"J'ai froid (litt. : Je suis froid).",highlightNote:"Les états du corps utilisent le verbe ÊTRE (am/is/are) et non le verbe avoir : « I am cold »."}],trapQuestion:{question:"Quel pronom remplace « la vieille clé » (féminin en français) et quel verbe exprime « avoir froid » ?",options:[{id:"opt_1",text:"Le pronom 'she' et le verbe avoir.",isCorrect:!1},{id:"opt_2",text:"Le pronom neutre 'it' (objet inanimé), et le verbe être ('I am cold').",isCorrect:!0},{id:"opt_3",text:"Le pronom 'he' et la négation 'not' placée avant le verbe.",isCorrect:!1}]},coreRuleSummary:"1) Un seul mot 'not' placé juste après am/is/are suffit pour nier. 2) Tout objet singulier est neutre ('it'), jamais 'he' ou 'she'. 3) Les états physiques et émotionnels (avoir froid, avoir peur) utilisent le verbe ÊTRE (I am cold).",frenchTrapWarning:"Ne traduis jamais « La clé, elle est ici » par « she is here » (c'est un objet → « it is here ») ni « J'ai froid » par « I have cold »."},{id:"f_1c",tierId:"tier_1",subtierId:"1C",name:"Formule III : Le Sceau du Singulier (-S)",subtitle:"Actions au présent, mutation have → has et Paradoxe du S",patternSlots:[{id:"slot_subj3",label:"Sujet Singulier 3e pers. (He / She / It / The guard)",pos:"noun"},{id:"slot_verb_s",label:"Verbe d’action + S (sees / keeps / waits / has)",pos:"verb"},{id:"slot_obj",label:"Objet (the key / a shadow)",pos:"noun"}],inductiveSteles:[{enBricks:["I","see","the","guard.","He","sees","the","guard."],frTranslation:"Je vois le garde. Il voit le garde.",highlightNote:"Dès que le sujet est un seul individu ou objet tiers (He / She / It / The guard), le verbe reçoit le sceau « -s » (sees)."},{enBricks:["They","have","the","key.","She","has","the","key."],frTranslation:"Ils ont la clé. Elle a la clé.",highlightNote:"Exception majeure : avec He/She/It, « have » + « -s » se contracte en « has » (jamais « haves ») !"},{enBricks:["One","guard","waits.","Three","guards","wait."],frTranslation:"Un garde attend. Trois gardes attendent.",highlightNote:"Le Paradoxe du S : le -s sur un nom marque le pluriel (guards), mais le -s sur un verbe marque le SINGULIER (waits) !"}],trapQuestion:{question:"En quoi consiste le « Paradoxe du S » entre les noms et les verbes en anglais ?",options:[{id:"opt_1",text:"Le -s sur un nom marque le pluriel (three guards), mais le -s sur un verbe marque le SINGULIER (one guard waits, three guards wait).",isCorrect:!0},{id:"opt_2",text:"Le verbe prend un -s uniquement au pluriel avec 'they'.",isCorrect:!1},{id:"opt_3",text:"Le verbe 'have' devient 'haves' au singulier.",isCorrect:!1}]},coreRuleSummary:"1) Au présent, avec he, she, it ou un nom singulier, le verbe d'action reçoit un -s (sees, opens, keeps, waits). 2) 'have' devient 'has'. 3) Au pluriel (they, three guards), le verbe ne prend JAMAIS de -s.",frenchTrapWarning:"Ne mets jamais de -s au verbe après un sujet pluriel : « The three guards sees » est un piège → « The three guards see » !"}],md=[{id:"ex_1a_1",tierId:"tier_1",subtierId:"1A",type:"assemble_fr_en",promptText:"Une vieille clé",spokenTarget:"An old key",targetSequence:["An","old","key"],distractorPool:["A","keys","olds","the"],requiredBrickIds:["b_a","b_old","b_key"],requiredFormulaIds:["f_1a"],defaultErrorFeedback:"Formule I : l’adjectif (« old ») se place avant le nom (« key »), et « A » devient « An » devant le son de voyelle de « old ».",specificFeedbacks:[{triggerBrickOrChoice:"A",errorCategory:"phonetic",explanation:"Presque ! « Old » commence par un son de voyelle (/oʊ/). Pour que la phrase coule à l’oreille, « a » se transforme obligatoirement en « an » devant un son de voyelle : « An old key ».",ruleReminder:"Devant un son de voyelle (old) : a → an."},{triggerBrickOrChoice:"olds",errorCategory:"morphology",explanation:"La brique « olds » est un piège ! En anglais, les adjectifs sont invariables et ne prennent jamais de -s.",ruleReminder:"Adjectif toujours invariable : old."},{triggerBrickOrChoice:"WORD_ORDER",errorCategory:"word_order",explanation:"C’est le réflexe français ! En anglais (Formule I), l’adjectif (« old ») se place toujours AVANT le nom qu’il décrit (« key »).",ruleReminder:"[Déterminant] + [Adjectif] + [Nom] → An old key."}]},{id:"ex_1a_2",tierId:"tier_1",subtierId:"1A",type:"corrupted_brick",promptText:"Les petites portes",spokenTarget:"The small doors",corruptedInitialSequence:["The","smalls","doors"],targetSequence:["The","small","doors"],distractorPool:["small","door","a"],requiredBrickIds:["b_the","b_small","b_door"],requiredFormulaIds:["f_1a"],defaultErrorFeedback:"En anglais, les adjectifs sont invariables. Même s’il y a plusieurs portes (« doors » avec un -s), l’adjectif « small » ne prend jamais de -s !",specificFeedbacks:[{triggerBrickOrChoice:"smalls",errorCategory:"morphology",explanation:"En anglais, les adjectifs sont invariables. Même s’il y a plusieurs portes (« doors » avec un -s), l’adjectif « small » ne prend jamais de -s !",ruleReminder:"Pluriel sur le nom uniquement : The small doors."}]},{id:"ex_1a_3",tierId:"tier_1",subtierId:"1A",type:"mirror_trap",promptText:"Comment traduire « La grande pierre froide » ?",spokenTarget:"The big cold stone",targetSequence:["The","big","cold","stone"],distractorPool:[],mirrorChoices:[{id:"c_calque",text:"The stone big and cold",isCorrect:!1},{id:"c_ok",text:"The big cold stone",isCorrect:!0},{id:"c_det",text:"A big cold stone",isCorrect:!1}],requiredBrickIds:["b_the","b_big","b_cold","b_stone"],requiredFormulaIds:["f_1a"],defaultErrorFeedback:"Même quand il y a deux adjectifs (« big » et « cold »), ils se placent tous les deux AVANT le nom « stone ».",specificFeedbacks:[{triggerBrickOrChoice:"c_calque",errorCategory:"word_order",explanation:"Piège de l’ordre des mots : même quand il y a deux adjectifs (« big » et « cold »), ils se placent tous les deux AVANT le nom « stone ».",ruleReminder:"Tous les adjectifs précèdent le nom : The big cold stone."},{triggerBrickOrChoice:"c_det",errorCategory:"false_friend",explanation:"« A » veut dire « une » (indéfini). Ici on parle de « LA grande pierre froide » : il faut utiliser « The ».",ruleReminder:"The = le / la / les | A = un / une."}]},{id:"ex_1a_4",tierId:"tier_1",subtierId:"1A",type:"translate_en_fr",promptText:"An old guard, a cold door.",spokenTarget:"An old guard, a cold door.",targetSequence:["Un vieux garde,","une porte froide."],distractorPool:["Le vieux garde,","un garde froid,","les vieilles portes."],requiredBrickIds:["b_a","b_old","b_guard","b_cold","b_door"],requiredForm t / They are not."}]},{id:"ex_1b_3",tierId:"tier_1",subtierId:"1B",type:"translate_en_fr",promptText:"They are old stones, they are not doors.",spokenTarget:"They are old stones, they are not doors.",targetSequence:["Ce sont","de vieilles pierres,","ce ne sont pas","des portes."],distractorPool:["Ils ont","une vieille pierre,","elles sont pas","la porte."],requiredBrickIds:["b_they","b_are","b_old","b_stone","b_not","b_door"],requiredFormulaIds:["f_1a","f_1b"],defaultErrorFeedback:"Au pluriel, « they are » pour des objets se traduit naturellement par « ce sont / elles sont ».",specificFeedbacks:[{triggerBrickOrChoice:"Ils ont",errorCategory:"false_friend",explanation:"Attention : « are » est le verbe ÊTRE (sont), et non le verbe avoir (ont) !",ruleReminder:"They are = Ils/Elles sont / Ce sont."}]},{id:"ex_1b_4",tierId:"tier_1",subtierId:"1B",type:"corrupted_brick",promptText:"La grande porte n’est pas ici, elle est vieille.",spokenTarget:"The big door is not here, it is old.",corruptedInitialSequence:["The","big","door","is","not","here,","she","is","old."],targetSequence:["The","big","door","is","not","here,","it","is","old."],distractorPool:["it","he","they","are"],requiredBrickIds:["b_the","b_big","b_door","b_is","b_not","b_here","b_it","b_old"],requiredFormulaIds:["f_1b"],defaultErrorFeedback:"La brique « she » est corrompue : « The big door » est un objet inanimé, il faut utiliser « it » !",specificFeedbacks:[{triggerBrickOrChoice:"she",errorCategory:"false_friend",explanation:"Une porte est un objet inanimé : en anglais elle est neutre (« it »), jamais « she ».",ruleReminder:"The door → it."}]},{id:"ex_1b_5",tierId:"tier_1",subtierId:"1B",type:"assemble_fr_en",promptText:"Tu es un garde, tu n’as pas froid.",spokenTarget:"You are a guard, you are not cold.",targetSequence:["You","are","a","guard,","you","are","not","cold."],distractorPool:["is","have","am","an"],requiredBrickIds:["b_you","b_are","b_a","b_guard","b_not","b_cold"],requiredFormulaIds:["f_1b"],defa
